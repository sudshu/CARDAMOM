# Tier-A fixture domains per oracle module input.
#
# Ranges are DELIBERATELY wider than realistic model states: Tier A tests the
# function over its mathematical domain (including the clamp/branch edges);
# Tier B (tap captures of real call sites, P3) supplies realistic correlated
# states. loguniform: true samples log-uniformly (positive lo required).
#
# edge_cases are exact input rows appended after the LHS block - branch
# boundaries, exact-equality sites, and division-by-zero guards from the C.
# constraints are enforced by row-fixups in gen_fixtures.py (see FIXUPS).

HYDROFUN_EWT2MOI:
  ranges:
    ewt: [0.0, 1500.0]
    p: [0.2, 0.9]
    z: [0.01, 10.0]
  edge_cases:
    - [0.0, 0.5, 1.0]

HYDROFUN_MOI2EWT:
  ranges:
    moi: [0.0, 1.5]
    p: [0.2, 0.9]
    z: [0.01, 10.0]
  edge_cases:
    - [0.0, 0.5, 1.0]
    - [1.0, 0.5, 1.0]

HYDROFUN_MOI2CON:
  ranges:
    moi: {lo: 1.0e-4, hi: 1.5, loguniform: true}
    k0: {lo: 1.0e-9, hi: 1.0e-2, loguniform: true}
    b: [1.0, 20.0]
  edge_cases:
    - [1.0, 1.0e-5, 5.0]
    - [0.0, 1.0e-5, 5.0]     # moi=0 -> pow(0, 2b+3) = 0

HYDROFUN_MOI2PSI:
  ranges:
    moi: {lo: 1.0e-4, hi: 1.5, loguniform: true}
    psi_porosity: [-0.05, -1.0e-4]
    b: [1.0, 20.0]
  edge_cases:
    - [1.0, -0.001, 5.0]     # psi == psi_porosity exactly
    - [0.0, -0.001, 5.0]     # C: pow(inf, b) = inf; psi = -inf

HYDROFUN_PSI2MOI:
  ranges:
    psi: [-30.0, -1.0e-4]
    psi_porosity: [-0.05, -1.0e-4]
    b: [1.0, 20.0]
  edge_cases:
    - [-0.001, -0.001, 5.0]  # psi == psi_porosity -> moi = 1

DRAINAGE:
  # constraint (FIXUPS): psi_field <= psi_porosity (both negative MPa)
  ranges:
    sm: [0.0, 1.5]
    Qexcess: [0.0, 1.0]
    psi_field: [-0.5, -1.0e-3]
    psi_porosity: [-0.05, -1.0e-4]
    b: [1.0, 20.0]
  edge_cases:
    - [1.0, 0.5, -0.01, -0.001, 5.0]    # sm == 1 exactly (excess branch edge)
    - [1.2, 0.5, -0.01, -0.001, 5.0]    # sm > 1 (excess drainage)
    - [0.0, 0.5, -0.01, -0.001, 5.0]    # dry soil, psi -> -inf via pow(inf,b)

INTERNAL_ENERGY_PER_LIQUID_H2O_UNIT_MASS:
  ranges:
    TEMP: [180.0, 340.0]
  edge_cases:
    - [56.79]                 # zero-energy temperature -> U = 0

INITIALIZE_INTERNAL_SOIL_ENERGY:
  ranges:
    internal_energy_per_mm_H2O: [1.0e5, 1.3e6]
    H2O_mm: [0.0, 1500.0]
    dry_soil_vol_heat_capacity: [0.0, 3.0e6]
    depth: [0.0, 10.0]
  edge_cases:
    - [571691.6069999999, 100.0, 1.3e6, 1.0]   # ~exactly UI3 for 1mm water
    - [905691.607, 100.0, 1.3e6, 1.0]          # ~exactly UL3 boundary

MIN_QUADRATIC_SMOOTH:
  ranges:
    x: [0.0, 25.0]
    y: [0.0, 25.0]
    eta: [0.8, 0.999]
  edge_cases:
    - [0.0, 0.0, 0.99]        # z clamp fmax(z, 1e-18) active
    - [5.0, 5.0, 0.99]

MAX_EXPONENTIAL_SMOOTH:
  ranges:
    x: [-1.0, 35.0]
    y: [0.0, 0.02]
    x0: [1.0e-3, 0.05]
  edge_cases:
    - [0.001, 0.001, 0.001]   # x == y - x0 branch boundary region
    - [0.0, 1.0e-3, 2.0e-2]   # the transp call-site constants
    - [0.0, 1.0e-9, 5.0e-3]   # the lambda_lim call-site constants

COMPUTE_DAYLIGHT_HOURS:
  ranges:
    latitude: [-90.0, 90.0]
    DOY: [1.0, 366.0]
  edge_cases:
    - [66.6, 172.0]           # polar-day boundary region (mult ~ 1)
    - [-66.6, 172.0]          # polar-night boundary region (mult ~ -1)
    - [90.0, 172.0]           # tan(90deg*pi7/180) - not a true pole with 7-digit pi
    - [0.0, 80.0]

SOIL_TEMP_AND_LIQUID_FRAC:
  ranges:
    dry_soil_vol_heat_capacity: [0.0, 3.0e6]
    depth: [0.0, 10.0]
    soil_water: [1.0e-2, 1500.0]
    internal_energy: [1.0e4, 2.0e9]
  edge_cases:
    - [0.0, 0.0, 1.0, 571691.6069999999]  # INITIALIZE's internal 1mm/no-soil call shape
    - [1.3e6, 1.0, 100.0, 4.0e8]          # frozen branch
    - [1.3e6, 1.0, 100.0, 1.5e9]          # unfrozen branch

